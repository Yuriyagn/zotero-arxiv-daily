name: Daily arXiv Recommendations

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 00:00 UTC is 08:00 in Asia/Shanghai.
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: daily-arxiv-email
  cancel-in-progress: false

jobs:
  recommend-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Cache Jina model
        uses: actions/cache@v4
        with:
          path: models/huggingface
          key: jina-embeddings-v5-text-nano-retrieval

      - name: Generate recommendations and send email
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: uv run src/zotero_arxiv_daily/main.py

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top20-recommendations
          path: outputs/top20_recommendations.md
          if-no-files-found: warn
          retention-days: 14
